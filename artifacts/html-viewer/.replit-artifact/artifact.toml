kind = "web"
previewPath = "/html-viewer/"
title = "HTML Viewer"
version = "1.0.0"
id = "artifacts/html-viewer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/html-viewer/" ]
localPort = 18103

[services.development]
run = "pnpm --filter @workspace/html-viewer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/html-viewer", "run", "build" ]
publicDir = "artifacts/html-viewer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18103"
BASE_PATH = "/html-viewer/"
